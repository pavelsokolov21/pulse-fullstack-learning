[project]
name = "pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavel Sokolov", email = "pavlik.sokolov.2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.27.3",
]

[project.scripts]
pulse = "pulse.cli.main:app"


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.44.0",
    "poethepoet>=0.48.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.10",
]

[tool.poe.tasks]
lint = "ruff check ."
types = "pyright"
test = "pytest"
watch = "ptw . --now"
check = ["lint", "types", "test"]
dev = "fastapi dev"
openapi = "python -m pulse.api.export_openapi ../frontend/openapi.json"
migrate = "alembic upgrade head"

[tool.fastapi]
entrypoint = "pulse.api.main:app"

[tool.pyright]
typeCheckingMode = "strict"
# db/seed.py импортирует seed_data как соседний модуль; так его видят и pyright, и pytest.
extraPaths = ["src", "db"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "RUF", "SIM", "PT"]
# Кириллица в строках и комментариях: «а», «о», «с» похожи на латинские буквы.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["db"]
addopts = ["--import-mode=importlib"]

[tool.pytest-watcher]
now = true
clear = true
runner = ".venv/bin/python"
runner_args = ["-m", "pytest"]
