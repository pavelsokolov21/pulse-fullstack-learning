# Настройки Alembic. Адрес базы здесь не хранится: он содержит пароль и берётся из
# окружения (PULSE_MIGRATE_DATABASE_URL), см. migrations/env.py.
[alembic]
script_location = %(here)s/migrations
# Имена файлов миграций: 0002_add_foo.py сортируются по порядку применения.
file_template = %%(rev)s_%%(slug)s
# Номера ревизий читаются человеком: 0001, 0002, ... (задаются через --rev-id).
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
